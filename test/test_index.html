<!DOCTYPE html>
<html>
  <head>
    <title>My experiment</title>
    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
    <script src="jspsych/plugin-instructions.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-audio-slider-response@2.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
    <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />
  </head>
  <body></body>
  <script>

  
 /* initialize jsPsych */
    var jsPsych = initJsPsych({
      on_finish: function() {
        jsPsych.data.displayData();
      }
    });

    /* create timeline */
    var timeline = [];

     /* preload images */
    var preload = {
      type: jsPsychPreload,
      images: ['img/blickets1.png', 'img/blickets2.png']
    };
    timeline.push(preload);
    
     /* define welcome message trial */
    var welcome = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "Welcome to Story Board Testing. Press any key to begin."
    };
    timeline.push(welcome);

      /* define instructions trial */
    var instructions1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <p>Experiment 1: Still Image - Multiple Choice</p><p>Select which team will win <strong>L</strong>, 
        press the letter L on the keyboard for the team on the left.</p>
        <p>If you think the team on the right will win <strong>R</strong>, press the letter R on the keyboard. Please respond 
        as fast as you can.</p>
        <div style='width: 700px;'>
        <div style='float: left;'><img src='img/blicket1.png'></img>
        <p class='small'><strong>Press the L key</strong></p></div>
        <div style='float: right;'><img src='img/blicket2.png'></img>
        <p class='small'><strong>Press the R key</strong></p></div>
        </div>
        <p>Press any key to begin.</p>
      `,
      post_trial_gap: 2000
    };
    timeline.push(instructions1);

    /* define trial stimuli array for timeline variables */
    var test_stimuli = [
      { stimulus: "img/blicket1.png",  correct_response: 'l'},
      { stimulus: "img/blicket2.png",  correct_response: 'r'}
    ];

     /* define fixation */
    var fixation = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="font-size:60px;">+</div>',
      choices: "NO_KEYS",
      trial_duration: function(){
        return jsPsych.randomization.sampleWithoutReplacement([250, 500, 750, 1000, 1250, 1500, 1750, 2000], 1)[0];
      },
      data: {
        task: 'fixation'
      }
    };

        /* define experiment 1 trial */
    var test = {
      type: jsPsychImageKeyboardResponse,
      stimulus: jsPsych.timelineVariable('stimulus'),
      choices: ['l', 'r'],
      data: {
        task: 'response',
        correct_response: jsPsych.timelineVariable('correct_response')
      },
      on_finish: function(data){
        data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
      }
    };

    /* define test procedure */
    var exp1_procedure = {
      timeline: [fixation, test],
      timeline_variables: test_stimuli,
      repetitions: 5,
      randomize_order: true
    };
    timeline.push(exp1_procedure);


var stroop_variables = [
    { color: "blue", text: "blue", condition: "congruent" },
    { color: "red", text: "red", condition: "congruent" },
    { color: "yellow", text: "yellow", condition: "congruent" },
    { color: "green", text: "green", condition: "congruent" },
    { color: "blue", text: "yellow", condition: "incongruent" },
    { color: "red", text: "green", condition: "incongruent" },
    { color: "yellow", text: "blue", condition: "incongruent" },
    { color: "green", text: "red", condition: "incongruent" }
];

// these are in HTML, so <br> means "line break"
var instructions2 = {
    type: jsPsychInstructions,
    pages: [
      "Experiment 2: Text Color Task <br>Press Space to continue.",
      "In this experiment you will be presented with the words blue, red, yellow and green.<br>Press Space to continue.",
      "As soon as you see a new word, press its first letter.<br>For example, press the B key for blue.<br>Press Space to continue.",
      "Try to answer as quickly as you can!<br>Press Space to start the experiment.",
    ],
    key_forward: ' '
}

timeline.push(instructions2);

var fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '+',
    trial_duration: 500,
    response_ends_trial: false
};

// blank (inter trial interval)
var interval = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '',
  trial_duration: 250,
  response_ends_trial: false
}

var trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function () {
        // note: the outer parentheses are only here so we can break the line
        return (
             '<p style="color: '+jsPsych.timelineVariable("color")+'">'
             +jsPsych.timelineVariable("text")
             +'</p>'
        );
    },
    // 'choices' restricts the available responses for the participant
    choices: ['r','g','b','y'],
    data: {
      color: jsPsych.timelineVariable('color'),
      text: jsPsych.timelineVariable('text'),
      condition: jsPsych.timelineVariable('condition')
    }
};

var exp2_procedure = {
    timeline: [interval, fixation, trial],
    timeline_variables: stroop_variables
};

timeline.push(exp2_procedure);

/* preload audio */
    var preload = {
      type: jsPsychPreload,
      audio: ['img/Life.mp3', 'img/Remember.mp3']
    };
    timeline.push(preload);

 /* define trial stimuli array for timeline variables */    
var test_stimuli2 = [
      { stimulus: "img/Life.mp3"},
      { stimulus: "img/Remember.mp3"}
    ];    

var trial_audio = {
    type: jsPsychAudioSliderResponse,
    stimulus: jsPsych.timelineVariable('stimulus'),
    labels: ['Not Clear', 'Clear'],
    prompt: '<p>How clear is the audio?</p>',
    response_allowed_while_playing: false,
    require_movement: true
};

var trial_opinion = {
  type: jsPsychSurveyHtmlForm,
  preamble: '<p>What did you think of the audio?</p>',
  html: '<p>I thought it was <input type="text" id="test-resp-box" name="response" size="10" /></p>',
  autofocus: 'test-resp-box'
};
/* define test procedure */
var exp3_procedure = {
    timeline: [trial_audio, trial_opinion],
    timeline_variables: test_stimuli2,
    repetitions: 5,
    randomize_order: true
};

timeline.push(exp3_procedure);

    /* start the experiment */
    jsPsych.run(timeline);
  </script>
